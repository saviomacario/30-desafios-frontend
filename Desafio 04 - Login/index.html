<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/variaveis.css">
    <link rel="stylesheet" href="./css/grid.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/responsivo-tablet.css">
    <link rel="stylesheet" href="./css/responsivo-cell.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Desafio 03</title>
</head>

<body>
    <section class="containerPai">
        <div class="container">
            <div class="card-esquerdo">
                <img src="./img/imagem-esquerda.png" alt="Imagem caricata">
            </div>
        </div>

        <div class="card-direito">
            <div class="container">
                <div class="box">
                    <div class="box-info">
                        <hgroup>
                            <p>Bem-vindo de volta</p>
                            <h3>Faça login na sua conta</h3>
                        </hgroup>

                        <div class="box-form">
                            <form>
                                <p>E-mail</p>
                                <input type="email" placeholder="exemplo@gmail.com" id="inEmail">

                                <p class="senha">Senha</p>
                                <input type="password" placeholder="0123456789" id="inSenha">
                            </form>
                        </div>

                        <div class="esqueceu-senha">
                            <p><a href="#">Lembre de mim</a></p>
                            <span><a href="#">Esqueceu a senha?</a></span>
                        </div>

                        <div class="box-button">
                            <button class="btn-entrar">Entrar</button>
                            <button class="btn-social">
                                <img src="./img/icon-google.svg" alt="Google icon">
                                ou faça login com o Google
                            </button>
                        </div>
                    </div>

                    <div class="cadastre">
                        <p>Não tem conta?</p>
                        <span><a href="">Cadastre-se</a></span>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
