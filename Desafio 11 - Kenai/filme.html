        <nav class="header-nav">
            <img class="logo-header" src="./img/tela-principal/header/Kenai.svg" alt="icone da Kenai">

            <div class="list-header">
                <ul>
                    <li>
                        <a aria-label="Pesquisar" href="#">
                            <img id="icon-search" src="./img/tela-principal/header/button-search.svg"alt="Icone de Pesquisa">
                        </a>
                    </li>
                    
                    <li>
                        <a href="#">Início</a>

                    </li>

                    <li>
                        <a aria-label="Usuário" href="#">
                            <img id="icon-search" src="./img/tela-principal/header/button-user.svg"alt="Icone de usuário">
                        </a>
                    </li>

                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <section class="informações">
                <div class="tempo-genero">
                    <div class="genero">
                        <span class="text-amarelo">Ação/Aventura</span>
                    </div>
                    <div class="tempo">
                        <!-- Aqui irá ficar as estrelas e o timer do filme -->
                    </div>
                </div>
            </section>
            <section class="slide">
                <!-- Aqui irá ficar os filmes sugeridos ou em catelogo, lembrando que será um slide no responsivo -->
            </section>
        </div>
    </main>
