<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Viagem de Chihiro</title>
    <link rel="stylesheet" href="./CSS/grid.css">
    <link rel="stylesheet" href="./CSS/reset.css">
    <link rel="stylesheet" href="./CSS/variaveis.css">
    <link rel="stylesheet" href="./CSS/main.css">
    <link rel="stylesheet" href="./CSS/responsivo-tablet.css">
    <link rel="stylesheet" href="./CSS/responsivo-cell.css">
    <link rel="shortcut icon" href="./img/logo-studio-ghibli.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Andada+Pro:ital,wght@0,400..840;1,400..840&family=Archivo:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>

<body>
        <!-- segundo o claude, o header não tem section -->
    <header>
        <div class="container">
            <img src="./img/logo-studio-ghibli.png" alt="Studio Ghibli" id="logo">

            <nav>
                <ul class="list-social">
                    <li>
                        <a href="#">
                            <img src="./img/icon/icon-google.svg" alt="Icon Google" class="icon">
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <img src="./img/icon/icon-facebook.svg" alt="Icon Facebook" class="icon">
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <img src="./img/icon/icon-twitter.svg" alt="Icon Twitter" class="icon">
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <img src="./img/icon/icon-instagram.svg" alt="Icon Instagram" class="icon">
                        </a>
                    </li>
            </nav>
        </div>
    </header>   

    <main>
        <div class="container">
            <section class="filme">
                <div class="left">
                    <div class="info-filme">
                        <div class="autor-nameFilme">
                            <h2>
                                Hayao Miyazaki
                            </h2>

                            <h1>
                                A viagem de Chihiro
                            </h1>
                        </div>

                        <p>
                            Chihiro chega a um mundo mágico dominado por uma bruxa.
                            Aqueles que a desobedecem são transformados em animais.
                        </p>
                    </div>

                    <div class="button-assistir">
                        <button type="button" class="btn">
                            <img src="./img/icon/Play.svg" alt="Play">
                            Assistir agora
                        </button>

                        <button type="button" class="btn-vazado">
                            Assista o trailer
                        </button>
                    </div>
                </div>

                <div class="right">
                    <img src="./img/ilustra-fastasma.png" alt="Ilustração de Fantasma">
                </div>
            </section>
        </div>
    </main>
</body>

</html>
